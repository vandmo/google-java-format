name: Test and Release
on: [push, pull_request, workflow_dispatch]

jobs:

  test:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7

      - name: Run ShellCheck
        run:
          shellcheck *.sh
          shellcheck tasks/*

      - uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # pinned from tag v3.4.0
        with:
          dockerfile: Dockerfile

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # pinned from tag v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # pinned from tag v4.2.0

      - name: Build
        id: docker_build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # pinned from tag v7.3.0
        with:
          platforms: linux/amd64
          load: true
          push: false
          tags: the-image

      - name: Test version output
        run: docker run --rm the-image google-java-format --version

      - name: Test formatting functionality
        run: docker run --rm -v ${{ github.workspace }}:/workspace the-image /workspace/test-formatting.sh

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/release-')
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7

      - name: Set Versions
        uses: actions/github-script@v9
        id: set_version
        with:
          script: |
            const tag = context.ref.substring(10)
            const no_release = tag.replace('release-', '')
            const dash_index = no_release.lastIndexOf('-')
            const no_dash = (dash_index > -1) ?  no_release.substring(0, dash_index) : no_release
            const parts = no_dash.split('.')
            if (parts.length != 3) {
              throw new Error(`Unexpected version ${no_dash}`)
            }
            const major = parts[0]
            const minor = parts[1]
            const subminor = parts[2]
            core.setOutput('major', major)
            core.setOutput('major-minor', `${major}.${minor}`)
            core.setOutput('major-minor-subminor', `${major}.${minor}.${subminor}`)

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # pinned from tag v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # pinned from tag v4.2.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # pinned from tag v4.6.0
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Build and Push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # pinned from tag v7.3.0
        with:
          push: true
          platforms: linux/arm64,linux/amd64
          tags: |
            ${{secrets.DOCKERHUB_USERNAME}}/google-java-format:latest
            ${{secrets.DOCKERHUB_USERNAME}}/google-java-format:${{steps.set_version.outputs.major}}
            ${{secrets.DOCKERHUB_USERNAME}}/google-java-format:${{steps.set_version.outputs.major-minor}}
            ${{secrets.DOCKERHUB_USERNAME}}/google-java-format:${{steps.set_version.outputs.major-minor-subminor}}
